<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enterprise Console Colors</title>
  <link rel="stylesheet" href="../tokens.css" />
  <style>
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 24px; }
    main { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: var(--text-3xl); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .swatch { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow: hidden; }
    .color { height: 88px; background: var(--value); }
    .meta { padding: 12px; display: grid; gap: 4px; }
    code { color: var(--muted); font-family: var(--font-mono); font-size: var(--text-sm); }
  </style>
</head>
<body>
  <main>
    <h1>Enterprise Console Colors</h1>
    <section class="grid">
      <article class="swatch" style="--value: var(--bg)"><div class="color"></div><div class="meta"><strong>Workspace</strong><code>--bg</code></div></article>
      <article class="swatch" style="--value: var(--surface)"><div class="color"></div><div class="meta"><strong>Surface</strong><code>--surface</code></div></article>
      <article class="swatch" style="--value: var(--surface-warm)"><div class="color"></div><div class="meta"><strong>Header band</strong><code>--surface-warm</code></div></article>
      <article class="swatch" style="--value: var(--fg)"><div class="color"></div><div class="meta"><strong>Foreground</strong><code>--fg</code></div></article>
      <article class="swatch" style="--value: var(--accent)"><div class="color"></div><div class="meta"><strong>Accent</strong><code>--accent</code></div></article>
      <article class="swatch" style="--value: var(--success)"><div class="color"></div><div class="meta"><strong>Success</strong><code>--success</code></div></article>
      <article class="swatch" style="--value: var(--warn)"><div class="color"></div><div class="meta"><strong>Warning</strong><code>--warn</code></div></article>
      <article class="swatch" style="--value: var(--danger)"><div class="color"></div><div class="meta"><strong>Danger</strong><code>--danger</code></div></article>
    </section>
  </main>
</body>
</html>
